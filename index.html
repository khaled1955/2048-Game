<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber 2048 - Sci-Fi Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style/style.css">
</head>
<body class="cyber-bg min-h-screen text-slate-100 flex flex-col items-center justify-between p-3 sm:p-6 select-none overflow-x-hidden relative">

    <div class="synth-grid"></div>
    <div class="cyber-skyline"></div>
    <div class="circuit-line circuit-left"></div>
    <div class="circuit-line circuit-right"></div>
    <div class="particles" id="particles"></div>
    
    <div class="w-full max-w-md flex flex-col items-center z-10 relative my-auto">
        
        <header class="w-full flex justify-center items-center mb-3 px-2">
            <div class="cyber-title text-3xl font-black italic tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-fuchsia-400 to-pink-500">
                2048
            </div>
        </header>
        <div class="w-full grid grid-cols-2 gap-3 mb-3">
            <div class="glass-panel p-2.5 rounded-xl text-center border border-cyan-500/40 shadow-[0_0_15px_rgba(6,182,212,0.2)]">
                <div class="text-[10px] tracking-widest text-cyan-400 font-bold uppercase">SCORE</div>
                <div id="score" class="text-2xl font-black text-cyan-200 font-mono tracking-wider">0</div>
            </div>
            <div class="glass-panel p-2.5 rounded-xl text-center border border-fuchsia-500/40 shadow-[0_0_15px_rgba(217,70,239,0.2)]">
                <div class="text-[10px] tracking-widest text-fuchsia-400 font-bold uppercase">BEST</div>
                <div id="best-score" class="text-2xl font-black text-fuchsia-200 font-mono tracking-wider">0</div>
            </div>
        </div>
        <div class="w-full flex justify-between items-center px-3 py-1.5 rounded-lg bg-slate-900/80 border border-slate-800 text-[11px] mb-3">
            <div class="flex items-center gap-1.5 text-pink-400 font-bold">
                <i class="fa-solid fa-bolt text-amber-400"></i> COMBO X1
            </div>
            <div class="text-slate-300 font-mono">
                LAST MOVE: <span id="last-move" class="text-cyan-400 font-bold">[ - ]</span>
            </div>
        </div>
        <div class="w-full aspect-square glass-panel p-3 rounded-2xl border-2 border-cyan-500/50 shadow-[0_0_35px_rgba(6,182,212,0.3)] relative flex flex-col justify-between">
            <div id="grid-container" class="grid grid-cols-4 gap-2.5 h-full w-full">
                <div class="grid-cell rounded-xl"></div>
                <div class="grid-cell rounded-xl"></div>
                <div class="grid-cell rounded-xl"></div>
                <div class="grid-cell rounded-xl"></div>
                <div class="grid-cell rounded-xl"></div>
                <div class="grid-cell rounded-xl"></div>
                <div class="grid-cell rounded-xl"></div>
                <div class="grid-cell rounded-xl"></div>
                <div class="grid-cell rounded-xl"></div>
                <div class="grid-cell rounded-xl"></div>
                <div class="grid-cell rounded-xl"></div>
                <div class="grid-cell rounded-xl"></div>
                <div class="grid-cell rounded-xl"></div>
                <div class="grid-cell rounded-xl"></div>
                <div class="grid-cell rounded-xl"></div>
                <div class="grid-cell rounded-xl"></div>
            </div>
        </div>
        <div class="w-full grid grid-cols-3 gap-3 mt-4">
            <div class="flex flex-col gap-2 justify-center">
                <button id="undo-btn" class="cyber-btn border-fuchsia-500/50 text-fuchsia-300 py-2 rounded-xl flex flex-col items-center justify-center gap-0.5 text-xs font-bold">
                    <i class="fa-solid fa-rotate-left text-sm"></i>
                    <span>UNDO</span>
                </button>
                <button id="sound-btn" class="cyber-btn border-cyan-500/50 text-cyan-300 py-2 rounded-xl flex flex-col items-center justify-center gap-0.5 text-xs font-bold">
                    <i id="sound-icon" class="fa-solid fa-volume-high text-sm"></i>
                    <span id="sound-text">SOUND</span>
                </button>
            </div>
            <div class="grid grid-cols-3 gap-1 bg-slate-900/60 p-1.5 rounded-xl border border-slate-800">
                <div></div>
                <button id="btn-up" class="arrow-btn"><i class="fa-solid fa-chevron-up"></i></button>
                <div></div>
                <button id="btn-left" class="arrow-btn"><i class="fa-solid fa-chevron-left"></i></button>
                <button id="btn-down" class="arrow-btn"><i class="fa-solid fa-chevron-down"></i></button>
                <button id="btn-right" class="arrow-btn"><i class="fa-solid fa-chevron-right"></i></button>
            </div>

            <div class="flex flex-col gap-2 justify-center">
                <button id="restart-btn" class="cyber-btn border-cyan-500/50 text-cyan-300 py-2 rounded-xl flex flex-col items-center justify-center gap-0.5 text-xs font-bold">
                    <i class="fa-solid fa-arrows-rotate text-sm"></i>
                    <span>RESTART</span>
                </button>
                
                <button id="rules-btn" class="cyber-btn border-fuchsia-500/50 text-fuchsia-300 py-2 rounded-xl flex flex-col items-center justify-center gap-0.5 text-xs font-bold">
                    <i class="fa-solid fa-book-open text-sm"></i>
                    <span>RULES</span>
                </button>
            </div>
        </div>

    </div>
    <div id="rules-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden flex items-center justify-center z-50 p-4 transition-all duration-300">
        <div class="glass-panel p-6 rounded-2xl border-2 border-fuchsia-500/60 bg-slate-950/90 max-w-sm w-full text-white shadow-[0_0_30px_rgba(217,70,239,0.3)] relative">
            
            <button id="close-rules-btn" class="absolute top-4 right-4 text-slate-400 hover:text-fuchsia-400 transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            
            <div class="text-center mb-4">
                <h2 class="text-xl font-bold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-fuchsia-400 uppercase">
                    <i class="fa-solid fa-gamepad mr-2"></i>How To Play
                </h2>
            </div>
            
            <div class="space-y-3 text-xs text-slate-200 font-sans leading-relaxed">
                <div class="flex items-start gap-2.5 bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                    <i class="fa-solid fa-arrows-up-down-left-right text-cyan-400 text-sm mt-0.5"></i>
                    <span>Use the arrow buttons or keys to move tiles in four directions.</span>
                </div>
                <div class="flex items-start gap-2.5 bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                    <i class="fa-solid fa-object-group text-fuchsia-400 text-sm mt-0.5"></i>
                    <span>When two tiles with the same number touch, they merge into one!</span>
                </div>
                <div class="flex items-start gap-2.5 bg-slate-900/60 p-2.5 rounded-lg border border-slate-800">
                    <i class="fa-solid fa-trophy text-amber-400 text-sm mt-0.5"></i>
                    <span>Keep merging numbers to reach the ultimate <strong class="text-cyan-300">2048</strong> tile.</span>
                </div>
            </div>

            <button id="got-it-btn" class="w-full mt-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-fuchsia-500 font-bold text-xs tracking-wider uppercase text-slate-950 hover:brightness-110 transition-all shadow-[0_0_15px_rgba(6,182,212,0.4)]">
                GOT IT
            </button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
